apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: online-shop
  namespace: online-shop-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: online-shop
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  #tum sbki mkc

  AIS: NA
  RCM: NA 
  ACTONE: NA 
  UDM: NA 
  IR:  NA 
  RCM_APP_sERVER: NA